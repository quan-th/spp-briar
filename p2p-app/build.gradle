apply plugin: 'com.android.application'

android {
	compileSdkVersion 34

	defaultConfig {
		applicationId "org.briar.p2p"
		minSdkVersion 21
		targetSdkVersion 33
		versionCode 1
		versionName "1.0"
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_7
		targetCompatibility JavaVersion.VERSION_1_7
	}
}

dependencies {
	implementation project(':bramble-core')
	implementation project(':bramble-api')
	implementation "org.briarproject:onionwrapper-android:$onionwrapper_version"
	implementation "org.briarproject:tor-android:$tor_version"
	implementation "org.briarproject:lyrebird-android:$lyrebird_version"

	implementation 'androidx.appcompat:appcompat:1.6.1'
	implementation 'androidx.recyclerview:recyclerview:1.3.1'
	implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
	implementation 'androidx.core:core-ktx:1.12.0'
}
